services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adnexa
      POSTGRES_USER: adnexa
      POSTGRES_PASSWORD: adnexa_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adnexa -d adnexa"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  postgres_data:
