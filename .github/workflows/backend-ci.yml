name: Backend CI
on:
  push:
    branches: ["develop/**"]
  pull_request:
    branches: ["main", "develop/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adnexa
          POSTGRES_PASSWORD: adnexa_ci_password
          POSTGRES_DB: adnexa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adnexa -d adnexa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
        env:
          SECRET_KEY: ci-only-secret-key-that-is-long-enough
          DATABASE_URL: postgresql+psycopg://adnexa:adnexa_ci_password@localhost:5432/adnexa_ci
      - name: Check model and migration consistency
        run: alembic check
        env:
          SECRET_KEY: ci-only-secret-key-that-is-long-enough
          DATABASE_URL: postgresql+psycopg://adnexa:adnexa_ci_password@localhost:5432/adnexa_ci
      - name: Run backend tests
        run: pytest -q
        env:
          SECRET_KEY: ci-only-secret-key-that-is-long-enough
          DATABASE_URL: sqlite:///./ci.db

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - run: npm run build
        env:
          ADNEXA_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"

  compose-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
        env:
          ADNEXA_SECRET_KEY: ci-compose-secret-key-that-is-long-enough
          POSTGRES_PASSWORD: adnexa_compose_ci_password
      - name: Build and start the complete stack
        run: docker compose up --build -d
        env:
          ADNEXA_SECRET_KEY: ci-compose-secret-key-that-is-long-enough
          POSTGRES_PASSWORD: adnexa_compose_ci_password
      - name: Wait for API and web services
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://localhost:8000/health >/dev/null \
              && curl --fail --silent http://localhost:3000/login >/dev/null; then
              echo "API health and frontend login route are responding."
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
