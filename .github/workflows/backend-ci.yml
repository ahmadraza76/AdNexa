name: Backend CI
on:
  push:
    branches: ["develop/**"]
  pull_request:
    branches: ["main", "develop/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adnexa
          POSTGRES_PASSWORD: adnexa_ci_password
          POSTGRES_DB: adnexa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adnexa -d adnexa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
        env:
          SECRET_KEY: ci-only-secret-key-that-is-long-enough
          DATABASE_URL: postgresql+psycopg://adnexa:adnexa_ci_password@localhost:5432/adnexa_ci
      - name: Check model and migration consistency
        run: alembic check
        env:
          SECRET_KEY: ci-only-secret-key-that-is-long-enough
          DATABASE_URL: postgresql+psycopg://adnexa:adnexa_ci_password@localhost:5432/adnexa_ci
      - name: Run backend tests
        run: pytest -q
        env:
          SECRET_KEY: ci-only-secret-key-that-is-long-enough
          DATABASE_URL: sqlite:///./ci.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          ADNEXA_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
